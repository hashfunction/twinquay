[metadata]
name = TwinQuay
version = attr: core.__version__
url = https://twinquay.trieflow.com
project_urls = 
    Support = https://twinquay.trieflow.com/support
    Privacy = https://twinquay.trieflow.com/privacy
author = Trieflow LLC; upstream authors credited in THIRD-PARTY-NOTICES.txt
license = GPLv3
license_files = LICENSE, THIRD-PARTY-NOTICES.txt
description = TwinQuay discovers duplicates with reviewable cleanup and recovery.
long_description = file:README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3 :: Only
    Topic :: Desktop Environment :: File Managers

[options]
packages = find:
python_requires = >=3.12,<3.13
install_requires =
    Send2Trash==2.1.0
    mutagen==1.48.1
    distro==1.9.0
    PyQt5==5.15.11
    PyQt5-sip==12.19.0
    PyQt5-Qt5==5.15.2; sys_platform == 'win32'
    PyQt5-Qt5==5.15.19; sys_platform == 'darwin'
    pywin32==311; sys_platform == 'win32'
    semantic-version==2.10.0
    xxhash==3.8.1
tests_require = 
    pytest==8.4.2
include_package_data = true

[options.entry_points]
console_scripts =
    twinquay = run:main
