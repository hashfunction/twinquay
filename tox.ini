[tox]
envlist = py312
skipsdist = True
skip_missing_interpreters = True

[testenv]
setenv =
    PYTHON="{envpython}"
commands =
    python build.py --modules
    flake8 core hscommon qt
    black --check core/cleanup_plan.py core/quarantine.py core/tests/cleanup_plan_test.py core/tests/quarantine_test.py
    {posargs:python -m pytest core hscommon}
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-extra.txt

[flake8]
exclude = .tox,env,build,cocoalib,cocoa,help,./qt/dg_rc.py,cocoa/run_template.py,./pkg
max-line-length = 120
select = C,E,F,W,B,B950
extend-ignore = E203, E501, W503
